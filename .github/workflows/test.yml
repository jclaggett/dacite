name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nbb:
    name: nbb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # parity:test is the nbb half of bin/parity.sh. The JVM half and
      # the digest compare need Clojure, so they stay local, like
      # core-boundary-test.
      - name: Reveal, parity, IndexedDB, peer, WebRTC, and mem-store suites
        run: |
          npm run reveal:test
          npm run parity:test
          npm run idb:test
          npm run peer:test
          npm run webrtc:test
          npm run mem:test

      # store:test exits 2 when the LMDB addon did not load. npm rebuild
      # keeps the format-v2 prebuild, so compile format v1 before the suite.
      - name: Rebuild LMDB for data format v1
        run: npm run lmdb:v1

      - name: Durable store suite
        run: npm run store:test

      # shadow-cljs.edn uses :deps, so peer:build and browser:test start
      # the compiler with the `clojure` executable. The suites above do not.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Clojure CLI
        run: |
          curl -fsSL -o /tmp/linux-install.sh \
            https://github.com/clojure/brew-install/releases/download/1.12.6.1673/linux-install.sh
          sudo bash /tmp/linux-install.sh
          clojure --version

      - name: Browser peer build and compiled test
        run: |
          npm run peer:build
          npm run browser:test

      # M5.2. Chromium only. Safari and Firefox are a one-time hand check;
      # the steps are in docs/plan/peering.md under M5.2.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser to nbb peer
        run: npm run peer:e2e

      # M6.4. The value browser pastes dacite://<host>#urn:dacite:<hex>
      # and fetches that hash from the nbb peer. Chromium only.
      - name: Value browser bundle
        run: npm run browser:build

      - name: Value browser fetch
        run: npm run browser:e2e

      # M5.3. The library bundle stays on cljs.build.api. Chromium reads a
      # chapter and the plate from the nbb peer, and falls back to the origin.
      - name: Library bundle
        run: npm run library:build

      - name: Library reader through the nbb peer
        run: npm run library:e2e
