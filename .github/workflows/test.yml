name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nbb:
    name: nbb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reveal, IndexedDB, and peer suites
        run: |
          npm run reveal:test
          npm run idb:test
          npm run peer:test

      # store:test exits 2 when the LMDB addon did not load. npm rebuild
      # keeps the format-v2 prebuild, so compile format v1 before the suite.
      - name: Rebuild LMDB for data format v1
        run: npm run lmdb:v1

      - name: Durable store suite
        run: npm run store:test
