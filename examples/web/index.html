<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dacite Todo (web demo)</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main class="app">
    <header>
      <h1>Dacite Todo</h1>
      <p class="tagline">Browser UI over content-addressed Dacite values via HTTP store + root CAS</p>
      <p id="status" class="status">loading…</p>
      <p id="bandwidth" class="bandwidth" title="Store-protocol body sizes only (node + root), not static assets">bw · …</p>
    </header>

    <section class="add-row">
      <input id="new-title" type="text" placeholder="New todo title" autocomplete="off"/>
      <button id="add-btn" type="button">Add</button>
      <button id="reload-btn" type="button" class="secondary">Reload</button>
    </section>

    <ul id="todo-list" class="todo-list"></ul>

    <footer>
      <p><strong>Values</strong> — Dacite vector of maps; add/toggle/remove + root load/seed (storage-agnostic).</p>
      <p><strong>Store</strong> — HTTP remote + write-back; pack-filled <code>GET /node</code>, <code>POST /nodes</code>, root CAS.</p>
    </footer>
  </main>
  <script>
    // same-origin API when served by dacite.service
    window.DACITE_API_BASE = window.DACITE_API_BASE || "";
  </script>
  <!-- cache-bust when pack/client changes; bump query after cljs-web rebuild -->
  <script src="js/main.js?v=pack-get-3"></script>
</body>
</html>
